<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Production Cost Calculator — EUnetHorse Digital Tools</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --teal:#0a7864;--teal-d:#085a4b;--lime:#a0be37;--cream:#F5F7F0;--paper:#FFFFFF;
  --ink:#12281F;--muted:#4E6459;--line:#D9E0D0;--obs:#F1F5EA;
  --warn:#C8862B;--warn-bg:#F5E9D3;--danger:#B23B32;--danger-bg:#F3DEDA;
  --amber:#C8862B;--amber-bg:#FEF5E7;
  --font:"Fira Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --teal:#3FB596;--lime:#A9CF52;--cream:#0C1A14;--paper:#13261D;
  --ink:#E4EEE7;--muted:#A3B8AC;--line:#2A4135;--obs:#182E23;
  --warn:#E3A857;--warn-bg:#3A2C16;--danger:#EE7B70;--danger-bg:#3D1D1A;
}}
:root[data-theme="dark"]{
  --teal:#3FB596;--lime:#A9CF52;--cream:#0C1A14;--paper:#13261D;
  --ink:#E4EEE7;--muted:#A3B8AC;--line:#2A4135;--obs:#182E23;
  --warn:#E3A857;--warn-bg:#3A2C16;--danger:#EE7B70;--danger-bg:#3D1D1A;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-wrap{background:#fff;border-radius:6px;padding:2px 8px}}
:root[data-theme="dark"] .logo-wrap{background:#fff;border-radius:6px;padding:2px 8px}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:70px}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 60px}

/* topbar */
.topbar{display:none;background:#085a4b;padding:9px 0}
.topbar-in{max-width:960px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.05em;color:#BFD6C9;gap:4px 12px;flex-wrap:wrap}

/* header */
header{padding:16px 0 12px;border-bottom:3px solid var(--teal);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-wrap{display:inline-block}
.logo-wrap img{height:44px;width:auto;display:block}
.title-block h1{font-weight:700;font-size:clamp(15px,2.5vw,21px);margin:0;line-height:1.15}
.title-block p{margin:2px 0 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang-wrap{display:flex;align-items:center;gap:6px}
.lang-wrap label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lang-wrap select{font-size:14px;padding:5px 8px;border-radius:4px;border:1px solid var(--teal);background:var(--paper);color:var(--ink);min-height:36px}
.theme-btn{background:none;border:1.5px solid var(--line);border-radius:4px;padding:5px 9px;cursor:pointer;font-size:16px;min-height:36px}
@media(max-width:520px){.logo-wrap img{height:34px}}

/* tabs */
.tabs{display:flex;border-bottom:1.5px solid var(--line);flex-wrap:wrap;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cream)}
@media(min-width:700px){.tabs{position:sticky}}
.tab-btn{font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;padding:13px 14px 10px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;min-height:44px}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--lime)}
@media(max-width:520px){.tab-btn{padding:11px 9px 8px;font-size:11px}}

/* cards & sections */
.intro-card{background:var(--paper);border:1.5px solid var(--line);border-left:4px solid var(--teal);border-radius:6px;padding:13px 15px;margin:18px 0 14px;font-size:14px;line-height:1.55;color:var(--muted)}
.intro-card strong{color:var(--ink)}
.notice{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--danger);background:var(--danger-bg);border-radius:12px;padding:2px 9px}
.section-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin:24px 0 10px;display:flex;align-items:center;gap:8px;font-weight:700}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* form */
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{background:var(--paper);border:1.5px solid var(--line);border-radius:3px;padding:7px 9px;font-size:14px;min-height:38px;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--lime);outline-offset:1px;border-color:var(--teal)}
.field.ro input{background:var(--obs);border-color:transparent;font-weight:700;color:var(--teal)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:580px){.g2,.g3{grid-template-columns:1fr}}

/* cost table */
.ct{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.ct-hdr{background:var(--teal-d);color:#F5F7F0;padding:9px 14px;font-weight:700;font-size:13px}
.ct-hdr.green{background:var(--teal)}
.ct-hdr.lime{background:var(--lime);color:#085a4b}
.cr{display:grid;grid-template-columns:1fr 120px 120px;border-top:1px solid var(--line);align-items:center}
.cr.alt{background:var(--obs)}
.cr.sub{background:var(--obs)}
.cr.res{background:#085a4b;color:#F5F7F0}
.cr.res-lime{background:var(--lime);color:#085a4b}
.cr.res-green{background:var(--teal);color:#F5F7F0}
.cr.vacc-alert{background:var(--warn-bg)}
.cl{padding:8px 12px;font-size:13.5px;line-height:1.35}
.cl .note{display:block;font-size:11.5px;color:var(--muted);font-style:italic;margin-top:1px}
.cl .anote{display:block;font-size:11.5px;color:var(--warn);font-style:italic;margin-top:1px}
.cv{padding:6px 8px;text-align:right}
.cv input{width:100%;text-align:right;background:var(--obs);border:1.5px solid var(--line);border-radius:3px;padding:5px 7px;font-size:13px;min-height:32px;color:var(--ink)}
.cv input:focus{outline:2px solid var(--lime);outline-offset:1px;border-color:var(--teal)}
.cval{font-size:13.5px;font-weight:700;color:var(--teal);text-align:right;padding:5px 0}
.cval.w{color:#F5F7F0}
.cval.d{color:#085a4b}
.ch{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:5px 8px;text-align:right;font-weight:700;background:var(--obs)}
.ch.dark{background:var(--teal);color:rgba(255,255,255,.8)}
@media(max-width:580px){.cr{grid-template-columns:1fr 90px 90px}}

/* vacc table */
.vt{width:100%;border-collapse:collapse}
.vt th{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:5px 8px;text-align:right;background:var(--obs);font-weight:700;border-bottom:1px solid var(--line)}
.vt th:first-child{text-align:left;padding-left:12px}
.vt td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.vt td:first-child{text-align:left;padding-left:12px;font-size:13.5px}
.vt tr.comp td{background:var(--warn-bg);color:var(--warn)}
.vt tr.comp td:first-child{font-weight:700}
.vt td input{width:90px;text-align:right;background:var(--paper);border:1.5px solid var(--line);border-radius:3px;padding:4px 6px;font-size:13px;min-height:30px;color:var(--ink)}
.vt td input:focus{outline:2px solid var(--lime);border-color:var(--teal)}
.vt-val{font-weight:700;color:var(--teal)}
.vt-val.w{color:var(--warn)}

/* buttons */
button.act{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;padding:9px 15px;border-radius:4px;border:1.5px solid #085a4b;background:#085a4b;color:#F5F7F0;cursor:pointer;min-height:38px}
button.act.sec{background:transparent;color:var(--ink);border-color:var(--line)}
button.act.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button.act:hover{opacity:.88}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.act:not(.sec):not(.danger){background:var(--lime);border-color:var(--lime);color:#085a4b}}
:root[data-theme="dark"] button.act:not(.sec):not(.danger){background:var(--lime);border-color:var(--lime);color:#085a4b}
.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}

/* save bar */
.save-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;padding:9px 13px;background:var(--obs);border-radius:6px;align-items:center;justify-content:space-between}
.save-bar span{font-size:12px;color:var(--muted)}
.save-bar .btns{display:flex;gap:6px;flex-wrap:wrap}

/* result summary */
.rs{background:#085a4b;color:#F5F7F0;border-radius:8px;padding:18px;margin-bottom:14px}
.rs-g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:500px){.rs-g{grid-template-columns:1fr}}
.rs-c{background:rgba(255,255,255,.08);border-radius:6px;padding:12px 14px}
.rs-l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9FC3AE;margin-bottom:3px}
.rs-v{font-size:28px;font-weight:700;line-height:1}
.rs-v small{font-size:13px;font-weight:400;color:#9FC3AE}
.rs-sub{font-size:12px;color:#9FC3AE;margin-top:3px}

/* info / legal */
.info-card{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:12px}
.info-card h3{margin:0 0 10px;font-size:16px}
.info-card p{margin:0 0 9px;font-size:14px;color:var(--muted);line-height:1.5}
.info-card p:last-child{margin-bottom:0}
.info-card strong{color:var(--ink)}

/* footer */
footer{margin-top:32px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:grid;gap:8px}
.foot-r{display:flex;justify-content:space-between;gap:8px 14px;flex-wrap:wrap}
.eu-blk{display:flex;gap:10px;align-items:flex-start}
.eu-blk svg{width:50px;height:33px;flex:none}
.eu-blk p{margin:0;line-height:1.45}
.linkish{background:none;border:0;padding:3px 0;color:var(--teal);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* dialog */
dialog{border:0;border-radius:8px;padding:0;max-width:600px;width:calc(100% - 32px);background:var(--paper);color:var(--ink);box-shadow:0 20px 50px rgba(8,30,20,.35)}
dialog::backdrop{background:rgba(8,90,75,.55)}
.dlg-b{padding:20px 22px;max-height:78vh;overflow:auto}
.dlg-b h2{font-size:19px;margin:0 0 10px}
.dlg-b p{margin:0 0 9px;font-size:14px;line-height:1.5}
.dlg-act{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px;border-top:1px solid var(--line)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px)+20px);transform:translate(-50%,28px);opacity:0;background:#085a4b;color:#F5F7F0;padding:10px 17px;border-radius:6px;font-weight:700;font-size:14px;z-index:60;transition:opacity .22s,transform .22s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media print{.topbar,.tabs,.save-bar,.actions,.toast,dialog,button{display:none!important}.wrap{padding:0}.ct{break-inside:avoid}}
</style>
</head>

.eh-top{background:var(--eh-teal);font-size:11px;padding:7px 0;color:rgba(255,255,255,.8);letter-spacing:.01em}
.eh-top a{color:#fff;text-decoration:none;font-weight:500}
.eh-top a:hover{text-decoration:underline}
.eh-logo{background:#fff;padding:14px 0}
.eh-logo a{display:block;line-height:0}
.eh-logo img{height:56px;width:auto;max-width:100%;display:block}
.eh-tag{font-size:13px;font-weight:700;color:var(--eh-teal);white-space:nowrap}
.eh-bar{background:var(--eh-teal);padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}
.eh-hdr .eh-bar h1{font-family:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;text-transform:none;margin:0;font-size:20px;font-weight:700;color:#fff;letter-spacing:.005em;line-height:1.25}
.eh-sub{font-size:12px;color:rgba(255,255,255,.82);margin-top:3px!important}
.eh-sub:empty{display:none}
.eh-hdr .eh-bar .eh-in{flex-direction:column;align-items:flex-start;gap:10px}
.eh-langs{display:flex;flex-wrap:wrap;gap:5px}
.eh-lang{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;padding:4px 9px;min-height:30px;font:500 12px/1 'Fira Sans',system-ui,sans-serif;cursor:pointer;transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.eh-lang svg{width:18px;height:12px;flex-shrink:0;border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.eh-lang:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.7)}
.eh-lang[aria-pressed="true"]{background:#fff;color:var(--eh-teal);border-color:#fff;font-weight:700}
.eh-lang:focus-visible{outline:2px solid var(--eh-cream);outline-offset:2px}
.eh-legacy{display:none!important}
@media (max-width:700px){
  .eh-top .eh-in{flex-direction:column;align-items:flex-start;gap:2px}
  .eh-logo img{height:42px}
  .eh-tag{font-size:12px}
  .eh-hdr .eh-bar h1{font-size:17px}
  .eh-hdr .eh-in{padding:0 14px}
}
@media print{.eh-langs{display:none}.eh-hdr{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* credits (first page only) */
.eh-credits{font-family:'Fira Sans',system-ui,sans-serif;margin:28px 0 8px;padding:14px 18px;background:#fff;border:1px solid #dde5e3;border-left:4px solid #0a7864;border-radius:6px;font-size:13px;line-height:1.55;color:#33443f;text-align:left}
.eh-credits[hidden],.eh-credits:empty{display:none!important}
.eh-credits h2{font-size:12px;font-weight:700;color:#0a7864;margin:0 0 2px;letter-spacing:.01em;text-transform:none}
.eh-credits p{margin:0}
.eh-credits .eh-cr-row+.eh-cr-row{margin-top:10px}
</style>

    if (c.experts && c.experts.length) h += '<div class="eh-cr-row"><h2>'+esc(t.experts)+'</h2><p>'+c.experts.map(esc).join(', ')+'</p></div>';
    return h;
  }
  var DEVS = ['Cristina Vierna (CTC)', 'Miriam Pateiro (CTC)'];
  function devsText(code){ return T(code).devs + ': ' + DEVS.join(', '); }
  function paint(){
    Array.prototype.forEach.call(document.querySelectorAll('.eh-devs'), function(el){ el.textContent = devsText(); });
    var t = T();
    var d = document.getElementById('ehDev'); if (d) d.innerHTML = t.dev.replace('{ctc}',LINK_CTC).replace('{eh}',LINK_EH);
    var f = document.getElementById('ehFunded'); if (f) f.textContent = t.funded + ' — Horizon Europe #101086551';
    var n = document.getElementById('ehLangs');
    if (n){ n.setAttribute('aria-label', t.lang);
      Array.prototype.forEach.call(n.querySelectorAll('.eh-lang'), function(b){ b.setAttribute('aria-pressed', norm(b.dataset.code)===norm(st.cur) ? 'true':'false'); }); }
    var html = creditsHTML();
    Array.prototype.forEach.call(document.querySelectorAll('.eh-credits[data-eh-static]'), function(el){ el.innerHTML = html; });
    document.documentElement.setAttribute('data-eh-lang', norm(st.cur));
  }
  function build(){
    var n = document.getElementById('ehLangs'); if (!n) return;
    n.innerHTML = '';
    var list = st.langs.slice().sort(function(a,b){ return ORDER.indexOf(norm(a)) - ORDER.indexOf(norm(b)); });
    list.forEach(function(code){
      var k = norm(code), b = document.createElement('button');
      b.type = 'button'; b.className = 'eh-lang'; b.dataset.code = code;
      b.title = NAMES[k] || k.toUpperCase(); b.setAttribute('lang', k==='be'?'nl-BE':k);
      b.innerHTML = (FL[k]||'') + '<span>' + k.toUpperCase() + '</span>';
      b.addEventListener('click', function(){ st.cur = code; paint(); if (st.on) st.on(code); });
      n.appendChild(b);
    });
  }
  window.EHH = {
    init: function(o){ st.langs = o.langs || []; st.cur = o.current || st.langs[0]; st.on = o.onSelect; build(); paint(); },
    bindSelect: function(sel){
      if (typeof sel === 'string') sel = document.getElementById(sel);
      if (!sel) return;
      EHH.init({ langs: Array.prototype.map.call(sel.options, function(o){ return o.value; }).filter(Boolean),
                 current: sel.value,
                 onSelect: function(c){ sel.value = c; sel.dispatchEvent(new Event('change', {bubbles:true})); } });
      sel.addEventListener('change', function(){ if (norm(sel.value)!==norm(st.cur)) { st.cur = sel.value; paint(); } });
    },
    setActive: function(c){ if (norm(c)!==norm(st.cur)) { st.cur = c; paint(); } },
    setTitle: function(txt){ var h = document.querySelector('.eh-bar h1'); if (h && h.textContent !== txt) h.textContent = txt; },
    showCredits: function(on){ Array.prototype.forEach.call(document.querySelectorAll('.eh-credits'), function(el){ el.hidden = !on; }); },
    creditsHTML: creditsHTML,
    devsText: devsText
  };
})();
</script>

  const tot=n(S.nPony)+n(S.nHorse);
  // Forage
  const fP={straw:forageMonthly(S.strawP,S.strawKP),shav:forageMonthly(S.shavP,S.shavKP),hay:forageMonthly(S.hayP,S.hayKP),conc:forageMonthly(S.concP,S.concKP)};
  const fH={straw:forageMonthly(S.strawP,S.strawKH),shav:forageMonthly(S.shavP,S.shavKH),hay:forageMonthly(S.hayP,S.hayKH),conc:forageMonthly(S.concP,S.concKH)};
  const sfP=fP.straw+fP.shav+fP.hay+fP.conc, sfH=fH.straw+fH.shav+fH.hay+fH.conc;
  // Water
  const wP=n(S.waterP)/1000*n(S.waterLP)*(365/12), wH=n(S.waterP)/1000*n(S.waterLH)*(365/12);
  // Shared costs per stall
  const manure=tot>0?n(S.manure)/tot:0;
  const fuel=tot>0?n(S.fuel)/tot:0;
  // Deworming: animals × freq × cost / 12 / total
  const dw=tot>0?(n(S.dwAnim)*n(S.dwFreq)*n(S.dwCost))/12/tot:0;
  // Vaccination: animals × freq × cost / 12 / total
  const vac=tot>0?(n(S.vacAnim)*n(S.vacFreq)*n(S.vacCost))/12/tot:0;
  const dvTotal=dw+vac;
  const subOther=(p)=>{return(p?wP:wH)+manure+fuel+dvTotal;};
  // Labour
  const totalMins=n(S.mF)+n(S.mFo)+n(S.mM)+n(S.mS)+n(S.mO)+n(S.mI)+n(S.mCl)+n(S.mBl)+n(S.mMa)+n(S.mOt)+n(S.mAd);
  const hDay=totalMins/60, hMo=hDay*(365/12), hStall=tot>0?hMo/tot:0;
  const labCost=S.labMode==="hourly"?n(S.hourlyRate)*hStall:(tot>0?n(S.payroll)/tot:0);
  // Property
  const propItems=[
    [S.tvTreadmill,S.tlTreadmill],[S.tvIndoor,S.tlIndoor],[S.tvOutdoor,S.tlOutdoor],
    [S.tvLunge,S.tlLunge],[S.tvFloor,S.tlFloor],[S.tvStable,S.tlStable],
    [S.tvFencing,S.tlFencing],[S.tvMach,S.tlMach],[S.tvOtherP,S.tlOtherP]
  ];
  const propTotal=propItems.reduce((s,[v,l])=>s+(n(v)>0&&n(l)>0?n(v)/(n(l)*12):0),0);
  const propStall=tot>0?propTotal/tot:0;
  // Financing
  const finStall=tot>0?(n(S.interest)/100*n(S.debt)/12+n(S.bankCharges))/tot:0;
  // Leasing
  const leasStall=tot>0?n(S.rent)/tot:0;
  // Maintenance
  const maintAnn=n(S.maTr)+n(S.maSt)+n(S.maPa)+n(S.maTf)+n(S.maFe)+n(S.maOt);
  const maintStall=tot>0?maintAnn/12/tot:0;
  // Insurance
  const insAnn=n(S.insRow)+n(S.membersRow)+n(S.feesRow)+n(S.accountRow);
  const insStall=tot>0?insAnn/12/tot:0;
  // Totals
  const costP=sfP+wP+manure+fuel+dvTotal+labCost+n(S.energy)+propStall+finStall+leasStall+maintStall+insStall;
  const costH=sfH+wH+manure+fuel+dvTotal+labCost+n(S.energy)+propStall+finStall+leasStall+maintStall+insStall;
  const revExclP=n(S.revP)/1.21, revExclH=n(S.revH)/1.21;
  return{fP,fH,sfP,sfH,wP,wH,manure,fuel,dw,vac,dvTotal,
    hDay,hMo,hStall,labCost,propStall,finStall,leasStall,maintStall,insStall,
    costP,costH,revExclP,revExclH,
    subOtherP:wP+manure+fuel+dvTotal, subOtherH:wH+manure+fuel+dvTotal};
}
function calcRC(cP,cH){
  const tot=n(S.nPony)+n(S.nHorse)||1;
  const vet=(n(S.rcVetExp)+n(S.rcVetRel)+n(S.rcFarrier)+n(S.rcDentist)+n(S.rcPhysio)+n(S.rcDeworm))/12/tot;
  const totalM=n(S.rcBrush)+n(S.rcSaddle)+n(S.rcHarness)+n(S.rcCovers)+n(S.rcMount)+n(S.rcOut)+n(S.rcIn)+n(S.rcCourseAdm);
  const hStallRC=(totalM/60)*(365/12)/tot;
  const labRC=n(S.rcHourly)*hStallRC;
  const trainCost=n(S.rcTrainer)*((n(S.rcWeeklyHrs)*52/12)/tot);
  const propRC=(n(S.rcHarnV)>0&&n(S.rcHarnL)>0?n(S.rcHarnV)/(n(S.rcHarnL)*12)/tot:0)
              +(n(S.rcHorseV)>0&&n(S.rcHorseL)>0?n(S.rcHorseV)/(n(S.rcHorseL)*12):0)
              +(n(S.rcPonyV)>0&&n(S.rcPonyL)>0?n(S.rcPonyV)/(n(S.rcPonyL)*12):0);
  const maintRC=(n(S.rcHarnMaint)+n(S.rcBlankets))/12/tot;
  const trainCosts2=(n(S.rcInstructor)+n(S.rcFirstAid))/12/tot;
  const insRC=(n(S.rcLiab)+n(S.rcHorseIns)+n(S.rcSoftware)+n(S.rcOtherIns))/12/tot;
  const extra=vet+labRC+trainCost+propRC+maintRC+trainCosts2+insRC;
  const totalP=cP+extra, totalH=cH+extra;
  const rev=n(S.rcRevYear)/12/tot;
  return{vet,labRC,trainCost,propRC,maintRC,trainCosts2,insRC,extra,totalP,totalH,rev,
    marP:rev-totalP,marH:rev-totalH,
    marPctP:totalP>0?(rev-totalP)/totalP:0,marPctH:totalH>0?(rev-totalH)/totalH:0};
}

// ── Input binding ────────────────────────────────────────────
function bindInputs(){
  // Numeric inputs with data-sid
  document.querySelectorAll('[data-sid]').forEach(function(el){
    el.addEventListener('input',function(){
      // Accept both comma and dot as decimal separator
      var raw=el.value.replace(',','.');
      S[el.dataset.sid]=parseFloat(raw)||0;
      // Don't recompute on every keystroke — wait for blur or debounce
      recompute();
    });
    // Clear "0" on focus so typing replaces it; on blur parse & clean
    el.addEventListener('focus',function(){
      if(this.value==='0'||this.value==='0.00'||this.value==='0.0')this.value='';
      this.select();
    });
    el.addEventListener('blur',function(){
      var raw=this.value.replace(',','.');
      var v=parseFloat(raw)||0;
      S[this.dataset.sid]=v;
      this.value=v||'';
      _doRecompute();
    });
  });
  // Text inputs
  document.querySelectorAll('[data-stxt]').forEach(function(el){
    el.addEventListener('input',function(){
      S[el.dataset.stxt]=el.value;
    });
  });
  // Select
  document.querySelectorAll('[data-sel]').forEach(function(el){
    el.addEventListener('change',function(){
      S[el.dataset.sel]=el.value;
      render();
    });
  });
  // Tab buttons
  document.querySelectorAll('[data-goto]').forEach(function(el){
    el.addEventListener('click',function(){
      S.tab=el.dataset.goto;render();window.scrollTo(0,0);
    });
  });
  // Action buttons
  ['btnSave','btnLoad','btnPrint','btnPrint2','btnClear','btnClearLegal','footClear'].forEach(function(id){
    var el=document.getElementById(id);
    if(!el)return;
    el.addEventListener('click',function(){
      if(id==='btnSave'){try{localStorage.setItem(STORE,JSON.stringify(S));toast(t('savedOk'));}catch(e){toast('Error: '+e.message);}}
      else if(id==='btnLoad'){try{var d=localStorage.getItem(STORE);if(d){S=Object.assign(blank(),JSON.parse(d));render();toast(t('loadedOk'));}else toast(t('noData'));}catch(e){toast('Error: '+e.message);}}
      else if(id==='btnPrint'||id==='btnPrint2'){window.print();}
      else if(id==='btnClear'||id==='btnClearLegal'||id==='footClear'){confirmDlg(t('confirmClearQ'),function(){S=blank();try{localStorage.removeItem(STORE);}catch(e){}render();toast(t('clearedOk'));});}
    });
  });
}

// Recompute with debounce — waits until user stops typing
var _recomputeTimer=null;
function recompute(){
  clearTimeout(_recomputeTimer);
  _recomputeTimer=setTimeout(function(){_doRecompute();},400);
}
function _doRecompute(){
  var sy=window.scrollY;
  var focused=document.activeElement;
  var focusedId=focused?focused.dataset.sid||focused.dataset.stxt||focused.id:null;
  var focusedVal=focused?focused.value:null;
  var focusedSel=[focused?focused.selectionStart:0,focused?focused.selectionEnd:0];
  if(S.tab==='calc')renderCalc();
  else if(S.tab==='rc')renderRC();
  renderFooter();
  bindInputs();
  window.scrollTo(0,sy);
  if(focusedId){
    var el=document.querySelector('[data-sid="'+focusedId+'"]')||document.querySelector('[data-stxt="'+focusedId+'"]')||document.getElementById(focusedId);
    if(el){
      el.focus();
      if(focusedVal!==null)el.value=focusedVal;
      try{el.setSelectionRange(focusedSel[0],focusedSel[1]);}catch(e){}
    }
  }
}

  document.documentElement.removeAttribute('data-theme');

  try{localStorage.setItem('enh-theme',theme);}catch(e){}applyTheme();
});
